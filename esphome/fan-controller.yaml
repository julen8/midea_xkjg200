# 美的xkjg200新风控制器
# 通过模拟 TS20 触摸芯片按键来控制新风
#
# 功能说明:
# 1. 作为 I2C 从机响应上位机(xkjg200控制面板)读取触摸芯片状态
# 2. 作为 I2C 主机控制 TS20 触摸芯片
# 3. 通过模拟按键控制风扇风速 (0=关闭, 1=低, 2=中, 3=高)
# 4. 读取风速状态引脚(xkjg200控制面板的led灯状态)获取当前风速

esphome:
  name: fan-controller
  friendly_name: "新风控制器"

# ESP32 平台配置
esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended
    advanced:
      minimum_chip_revision: "3.0"
      sram1_as_iram: true
    sdkconfig_options:
      CONFIG_I2C_ENABLE_SLAVE_DRIVER_VERSION_2: y

# 加载外部组件
external_components:
  - source: github://julen8/midea_xkjg200
    components: [ xkjg200_fan ]

# WiFi 配置
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # 备用热点 (如果无法连接到WiFi)
  ap:
    ssid: "xkjg200-AP"
    password: "12345678"

# 启用 captive portal (用于配置WiFi)
captive_portal:

web_server:
  port: 80
  version: 3
  include_internal: true

# 启用日志
logger:
  level: INFO

# 启用 Home Assistant API
api:
  encryption:
    key: !secret api_xkjg200_key

# OTA 更新
ota:
  - platform: esphome
    password: !secret ota_key

# xkjg200 风扇控制器组件
xkjg200_fan:
  id: xkjg200_controller
  name: "新风"
  speed_count: 3
  restore_mode: ALWAYS_OFF

text_sensor:
  - platform: template
    name: "新风状态"
    id: fresh_air_status
    icon: "mdi:fan"
    update_interval: 500ms
    lambda: |-
      switch (id(xkjg200_controller)->get_current_speed()) {
        case 0: return {"关闭"};
        case 1: return {"低风速"};
        case 2: return {"中风速"};
        case 3: return {"高风速"};
        default: return {"未知"};
      }

# 仅调试用 - 重新初始化 TS20 触摸芯片寄存器
switch:
  - platform: template
    name: "重新初始化TS20触摸芯片"
    id: reinit_ts20
    icon: "mdi:refresh"
    internal: true
    turn_on_action:
      - lambda: |-
          id(xkjg200_controller)->init_ts20_registers();
      - switch.turn_off: reinit_ts20
